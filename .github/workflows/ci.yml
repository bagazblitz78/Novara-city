name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  test-sqlite:
    name: Tests (SQLite)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  test-postgres:
    name: Tests (PostgreSQL parity)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novara
          POSTGRES_PASSWORD: novara_ci_password
          POSTGRES_DB: novara_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novara"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # prisma.config.ts selects prisma/schema.postgres.prisma from this URL,
      # so both the generated client and the pushed schema are PostgreSQL.
      DATABASE_URL: postgresql://novara:novara_ci_password@127.0.0.1:5432/novara_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Production build
    needs: [test-sqlite, test-postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
